<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel | Aruanã Natural</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <link rel="stylesheet" href="assets/css/admin.css">

</head>

<body>

<div class="container">

    <h1>Painel Aruanã</h1>

    <p class="subtitle">
        Administração dos feedbacks dos clientes.
    </p>


    <!-- LOGIN -->

    <div id="loginBox" class="login">

        <input
            type="email"
            id="email"
            placeholder="Seu e-mail"
        >

        <input
            type="password"
            id="password"
            placeholder="Sua senha"
        >

        <button id="loginButton">
            ENTRAR
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>


    <!-- PAINEL -->

    <div
        id="adminPanel"
        class="panel hidden"
    >

        <button
            class="logout"
            id="logoutButton"
        >
            SAIR
        </button>

        <div id="feedbackList"></div>

    </div>

</div>

    <script src="assets/js/admin.js"></script>

</body>

</html>
